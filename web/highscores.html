<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TYPE-TRIS | High Scores</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <script defer src="assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    .neon-glow-primary {
      text-shadow: 0 0 10px rgba(193, 255, 254, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen relative">
  <div class="fixed inset-0 pointer-events-none opacity-30 bg-[radial-gradient(rgba(115,117,125,0.15)_1px,transparent_1px)] [background-size:24px_24px]"></div>

  <main id="highscores-screen" class="relative z-10 max-w-3xl mx-auto px-6 pt-12 pb-16">
    <a href="player-menu.html" class="inline-flex items-center gap-2 font-label text-xs uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors mb-8">
      <span class="material-symbols-outlined text-lg">arrow_back</span>
      Player menu
    </a>

    <header class="mb-8">
      <h1 class="font-headline text-4xl md:text-5xl font-black italic text-primary neon-glow-primary uppercase tracking-tighter mb-2">Leaderboard</h1>
      <p class="text-on-surface-variant text-sm max-w-xl">Top players by high score (saved when a run ends). Start the server with <code class="text-primary/90">mvn exec:java</code> to load live data.</p>
    </header>

    <p id="highscores-message" class="hidden text-error text-sm mb-4" role="alert"></p>

    <div class="border border-outline-variant/30 bg-surface-container/80 backdrop-blur-sm shadow-[0_0_40px_rgba(0,0,0,0.35)] overflow-hidden rounded-sm">
      <table class="w-full text-sm">
        <thead>
          <tr class="border-b border-outline-variant/25 bg-surface-container-high/50 font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant">
            <th class="text-left py-3 px-3 font-extrabold">#</th>
            <th class="text-left py-3 px-2 font-extrabold">Player</th>
            <th class="text-right py-3 px-2 font-extrabold">High score</th>
            <th class="text-right py-3 px-2 font-extrabold">Best WPM</th>
            <th class="text-right py-3 px-3 font-extrabold">Avg accuracy</th>
          </tr>
        </thead>
        <tbody id="highscores-body" class="text-on-surface"></tbody>
      </table>
    </div>

    <a href="index.html" class="inline-block mt-10 font-label text-xs uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors">← Main menu</a>
  </main>
</body>
</html>
