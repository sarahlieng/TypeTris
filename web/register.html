<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TYPE-TRIS | Create Account</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <script defer src="assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    .bg-grid-cyan {
      background-size: 40px 40px;
      background-image:
        linear-gradient(to right, rgba(0, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
    }
    .neon-glow-primary {
      text-shadow: 0 0 10px rgba(193, 255, 254, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
    }
    .glitch-effect {
      position: relative;
    }
    .glitch-effect::before,
    .glitch-effect::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .glitch-effect::before {
      left: 2px;
      text-shadow: -2px 0 #ff51fa;
      clip: rect(44px, 450px, 56px, 0);
    }
    .glitch-effect::after {
      left: -2px;
      text-shadow: -2px 0 #8eff71;
      clip: rect(12px, 450px, 34px, 0);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary">
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute inset-0 bg-grid-cyan"></div>
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/10 blur-[120px] rounded-full"></div>

    <div class="absolute top-1/4 left-10 opacity-20 transform -rotate-12">
      <div class="w-12 h-12 border-2 border-primary-container shadow-[0_0_15px_rgba(0,255,255,0.3)]"></div>
      <div class="w-12 h-12 border-2 border-primary-container mt-[-2px] shadow-[0_0_15px_rgba(0,255,255,0.3)]"></div>
      <div class="w-12 h-12 border-2 border-primary-container mt-[-2px] shadow-[0_0_15px_rgba(0,255,255,0.3)]"></div>
    </div>
    <div class="absolute bottom-1/4 right-20 opacity-20 transform rotate-45">
      <div class="flex">
        <div class="w-10 h-10 border-2 border-secondary shadow-[0_0_15px_rgba(255,81,250,0.3)]"></div>
        <div class="w-10 h-10 border-2 border-secondary ml-[-2px] shadow-[0_0_15px_rgba(255,81,250,0.3)]"></div>
      </div>
      <div class="flex mt-[-2px]">
        <div class="w-10 h-10 border-2 border-secondary shadow-[0_0_15px_rgba(255,81,250,0.3)]"></div>
        <div class="w-10 h-10 border-2 border-secondary ml-[-2px] shadow-[0_0_15px_rgba(255,81,250,0.3)]"></div>
      </div>
    </div>
  </div>

  <main class="relative z-10 flex flex-col items-center justify-center px-6 py-10 min-h-screen">
    <h1 class="mb-6 font-headline text-6xl md:text-8xl font-black italic tracking-tighter text-primary neon-glow-primary glitch-effect leading-none" data-text="TYPE-TRIS">
      TYPE-TRIS
    </h1>
    <div class="w-full max-w-md bg-surface-container border border-outline-variant/20 shadow-2xl backdrop-blur-md">
      <div class="p-6 pb-0 flex items-center justify-between">
        <a href="login.html" class="group flex items-center justify-center p-2 hover:bg-surface-bright transition-all active:scale-95">
          <span class="material-symbols-outlined text-primary-dim">arrow_back</span>
        </a>
        <h2 class="font-headline font-bold text-2xl tracking-tight text-primary uppercase">Create Account</h2>
        <div class="w-10"></div>
      </div>

      <div class="p-8 space-y-6">
        <div class="space-y-2">
          <label class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant block">Email Address</label>
          <div class="relative group">
            <input id="register-email" class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-outline-variant font-body py-3 transition-all" placeholder="Enter your email" type="email" />
            <div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary-container transition-all duration-300 group-focus-within:w-full"></div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant block">Username</label>
          <div class="relative group">
            <input id="register-username" class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-outline-variant font-body py-3 transition-all" placeholder="Choose a username" type="text" />
            <div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary-container transition-all duration-300 group-focus-within:w-full"></div>
          </div>
        </div>

        <div class="space-y-6">
          <div class="space-y-2">
            <label class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant block">Password</label>
            <div class="relative group">
              <input id="register-password" class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-outline-variant font-body py-3 transition-all" placeholder="Create a password" type="password" />
              <div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary-container transition-all duration-300 group-focus-within:w-full"></div>
            </div>
          </div>
          <div class="space-y-2">
            <label class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant block">Confirm Password</label>
            <div class="relative group">
              <input id="register-confirm-password" class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline focus:border-primary-container focus:ring-0 text-on-surface placeholder:text-outline-variant font-body py-3 transition-all" placeholder="Confirm your password" type="password" />
              <div class="absolute bottom-0 left-0 h-[2px] w-0 bg-primary-container transition-all duration-300 group-focus-within:w-full"></div>
            </div>
          </div>
        </div>

        <div class="pt-4 space-y-6">
          <button id="register-submit" class="w-full py-4 bg-primary-container text-on-primary font-headline font-bold uppercase tracking-widest text-sm hover:brightness-110 active:scale-[0.98] transition-all shadow-[0_0_20px_rgba(0,255,255,0.4)]">
            CREATE ACCOUNT
          </button>
          <div class="text-center">
            <p id="register-message" class="hidden font-label text-[10px] uppercase tracking-[0.1em] mb-3"></p>
            <p class="font-label text-[10px] uppercase tracking-[0.1em] text-on-surface-variant">
              ALREADY CLEARING LINES?
              <a class="text-secondary font-bold hover:text-white transition-colors ml-1" href="login.html">LOGIN HERE</a>
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 flex gap-4">
      <div class="w-3 h-3 bg-primary"></div>
      <div class="w-3 h-3 bg-secondary"></div>
      <div class="w-3 h-3 bg-tertiary"></div>
      <div class="w-3 h-3 bg-primary-container"></div>
    </div>
  </main>

  <footer class="fixed bottom-0 w-full bg-transparent">
    <div class="flex flex-col md:flex-row justify-between items-center px-10 py-6 w-full max-w-7xl mx-auto">
      <div class="font-label font-medium text-[10px] tracking-[0.1em] uppercase text-slate-600">
        TEAM 26 • WINTER 2026 • CS2212
      </div>
    </div>
  </footer>
</body>
</html>
