<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TYPE-TRIS | Select difficulty</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <script defer src="assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    .dotted-bg {
      background-image: radial-gradient(rgba(115, 117, 125, 0.2) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .neon-glow-primary {
      text-shadow: 0 0 10px rgba(193, 255, 254, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
    }
    .neon-glow-cyan {
      text-shadow: 0 0 10px rgba(193, 255, 254, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
    }
    .neon-glow-yellow {
      text-shadow: 0 0 10px rgba(255, 255, 0, 0.8), 0 0 20px rgba(255, 255, 0, 0.4);
    }
    .neon-glow-magenta {
      text-shadow: 0 0 10px rgba(255, 81, 250, 0.8), 0 0 20px rgba(169, 0, 169, 0.4);
    }
    .glitch-effect {
      position: relative;
    }
    .glitch-effect::before,
    .glitch-effect::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .glitch-effect::before {
      left: 2px;
      text-shadow: -2px 0 #ff51fa;
      clip: rect(44px, 450px, 56px, 0);
    }
    .glitch-effect::after {
      left: -2px;
      text-shadow: -2px 0 #8eff71;
      clip: rect(12px, 450px, 34px, 0);
    }
    .level-btn-hover:hover {
      box-shadow: 0 0 15px rgba(193, 255, 254, 0.4);
      border-color: rgba(193, 255, 254, 0.8);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen relative flex flex-col items-center justify-center overflow-x-hidden p-8 md:p-16">
  <div class="fixed inset-0 dotted-bg pointer-events-none opacity-40"></div>
  <div class="fixed top-20 left-[10%] w-12 h-12 border-2 border-primary/20 rotate-12 pointer-events-none"></div>
  <div class="fixed bottom-40 left-[15%] w-16 h-8 border-2 border-secondary/20 -rotate-12 pointer-events-none"></div>

  <a href="player-menu.html" class="fixed top-6 left-6 z-20 flex items-center gap-2 font-label text-xs uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors">
    <span class="material-symbols-outlined text-lg">arrow_back</span>
    Back
  </a>

  <div class="relative z-10 flex flex-col items-center w-full max-w-7xl mx-auto">
    <div class="flex flex-col items-center mb-8 md:mb-12">
      <h1 class="font-headline text-6xl md:text-8xl font-black italic tracking-tighter text-primary neon-glow-primary glitch-effect leading-none" data-text="TYPE-TRIS">TYPE-TRIS</h1>
      <span class="font-label text-sm font-bold text-secondary-dim tracking-[0.3em] uppercase mt-4">SELECT GAME LEVEL</span>
    </div>

    <main class="w-full" id="difficulty-screen">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-stretch">
        <section class="bg-surface-container/60 backdrop-blur-xl border border-outline/20 p-8 pt-10 pb-10 flex flex-col shadow-[0_0_40px_rgba(0,0,0,0.3)] group transition-all">
          <div class="mb-10 text-center">
            <h2 class="font-headline text-3xl font-black text-primary uppercase tracking-tighter neon-glow-cyan">EASY</h2>
          </div>
          <div class="flex flex-col gap-4 mt-auto">
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="easy" data-level="1">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 1</span>
            </button>
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="easy" data-level="2">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 2</span>
            </button>
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="easy" data-level="3">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 3</span>
            </button>
          </div>
        </section>

        <section class="bg-surface-container/60 backdrop-blur-xl border border-outline/20 p-8 pt-10 pb-10 flex flex-col shadow-[0_0_40px_rgba(0,0,0,0.3)] group transition-all">
          <div class="mb-10 text-center">
            <h2 class="font-headline text-3xl font-black text-yellow-300 uppercase tracking-tighter neon-glow-yellow">MEDIUM</h2>
          </div>
          <div class="flex flex-col gap-4 mt-auto">
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="medium" data-level="1">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 1</span>
            </button>
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="medium" data-level="2">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 2</span>
            </button>
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="medium" data-level="3">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 3</span>
            </button>
          </div>
        </section>

        <section class="bg-surface-container/60 backdrop-blur-xl border border-outline/20 p-8 pt-10 pb-10 flex flex-col shadow-[0_0_40px_rgba(0,0,0,0.3)] group transition-all">
          <div class="mb-10 text-center">
            <h2 class="font-headline text-3xl font-black text-secondary-dim uppercase tracking-tighter neon-glow-magenta">HARD</h2>
          </div>
          <div class="flex flex-col gap-4 mt-auto">
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="hard" data-level="1">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 1</span>
            </button>
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="hard" data-level="2">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 2</span>
            </button>
            <button type="button" class="difficulty-level-btn w-full py-4 px-6 border border-primary/40 bg-surface-container/40 level-btn-hover transition-all text-center group/btn" data-tier="hard" data-level="3">
              <span class="font-label text-sm font-bold text-on-surface tracking-widest uppercase group-hover/btn:text-primary transition-colors">Level 3</span>
            </button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
</body>
</html>
