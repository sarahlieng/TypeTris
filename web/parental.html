<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script defer src="assets/js/app.js"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "inverse-primary": "#006a6a",
                        "surface-container-high": "#1c2028",
                        "inverse-on-surface": "#52555c",
                        "on-secondary-fixed": "#620061",
                        "on-tertiary": "#0d6100",
                        "error": "#ff6e84",
                        "secondary-container": "#a900a9",
                        "on-tertiary-fixed-variant": "#0d6200",
                        "surface-container-lowest": "#000000",
                        "surface-dim": "#0b0e14",
                        "primary-fixed": "#00f5f5",
                        "primary-fixed-dim": "#00e6e6",
                        "tertiary-fixed-dim": "#2be800",
                        "on-surface": "#ecedf6",
                        "on-primary-container": "#005d5d",
                        "secondary-dim": "#ff51fa",
                        "tertiary-fixed": "#2ff801",
                        "on-error": "#490013",
                        "secondary-fixed": "#ffbdf3",
                        "on-tertiary-fixed": "#064200",
                        "surface-container-highest": "#22262f",
                        "on-secondary-fixed-variant": "#920091",
                        "on-primary-fixed": "#004343",
                        "surface-variant": "#22262f",
                        "surface-bright": "#282c36",
                        "on-error-container": "#ffb2b9",
                        "primary": "#c1fffe",
                        "secondary-fixed-dim": "#ffa6f3",
                        "on-background": "#ecedf6",
                        "error-dim": "#d73357",
                        "tertiary-dim": "#2be800",
                        "on-secondary": "#400040",
                        "tertiary": "#8eff71",
                        "on-surface-variant": "#a9abb3",
                        "background": "#0b0e14",
                        "surface": "#0b0e14",
                        "on-tertiary-container": "#0b5800",
                        "on-primary": "#006767",
                        "tertiary-container": "#2ff801",
                        "secondary": "#ff51fa",
                        "surface-tint": "#c1fffe",
                        "surface-container-low": "#10131a",
                        "primary-container": "#00ffff",
                        "outline": "#73757d",
                        "surface-container": "#161a21",
                        "inverse-surface": "#f9f9ff",
                        "outline-variant": "#45484f",
                        "on-secondary-container": "#fff5f9",
                        "primary-dim": "#00e6e6",
                        "on-primary-fixed-variant": "#006262",
                        "error-container": "#a70138"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Plus Jakarta Sans"]
                    },
                    borderRadius: { "DEFAULT": "0px", "lg": "0px", "xl": "0px", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .kinetic-glow {
            box-shadow: 0 0 20px rgba(193, 255, 254, 0.2);
        }
        .glass-overlay {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface overflow-hidden">
<div class="fixed inset-0 z-0 bg-[#000000]" data-alt="deep space background with faint geometric grid patterns and occasional neon particle glints in cyan and magenta">
<div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #45484f 1px, transparent 0); background-size: 40px 40px;"></div>
<div class="flex flex-col items-center justify-center h-full opacity-30 grayscale">
<h1 class="font-headline text-9xl font-black text-primary tracking-tighter italic">TYPE-TRIS</h1>
<div class="mt-8 grid grid-cols-2 gap-8 font-label">
<div class="text-right">
<p class="text-on-surface-variant">HIGH SCORE</p>
<p class="text-secondary text-4xl font-bold">99,999</p>
</div>
<div>
<p class="text-on-surface-variant">LEVEL</p>
<p class="text-tertiary text-4xl font-bold">14</p>
</div>
</div>
</div>
</div>
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-surface-container-lowest/80 glass-overlay p-6">
<div class="w-full max-w-[420px] bg-surface-container/90 border-2 border-primary-dim kinetic-glow p-10 flex flex-col items-center text-center">
<div class="mb-6">
<span class="material-symbols-outlined text-primary text-5xl" data-icon="lock">lock</span>
</div>
<h2 class="font-headline text-2xl font-black text-on-surface uppercase tracking-tight mb-2">
                PARENT/TEACHER LOGIN
            </h2>
<p class="font-body text-on-surface-variant text-sm leading-relaxed mb-10 max-w-[280px]">
                Please enter your administrative PIN to access controls.
            </p>
<form id="parental-login-form" class="w-full">
<div class="w-full mb-6 space-y-2">
<div class="relative group">
<input id="parental-pin" class="w-full bg-surface-container-lowest border-2 border-outline-variant focus:border-primary text-center font-headline text-2xl tracking-[1em] py-4 placeholder:tracking-normal placeholder:text-sm placeholder:font-body placeholder:text-on-surface-variant text-primary focus:ring-0 transition-all" maxlength="4" placeholder="Enter PIN" type="password"/>
<div class="absolute inset-0 pointer-events-none border border-primary/0 group-focus-within:border-primary/20 transition-all"></div>
</div>
<p id="parental-message" class="hidden text-xs uppercase tracking-widest"></p>
</div>
<button type="submit" class="w-full bg-primary-container text-on-primary-container font-headline font-black py-4 hover:brightness-110 active:scale-[0.98] transition-all uppercase tracking-widest text-lg flex items-center justify-center gap-2">
                SUBMIT
                <span class="material-symbols-outlined text-xl" data-icon="login">login</span>
</button>
</form>
<button onclick="window.location.href='index.html'" class="mt-4 font-label text-xs text-on-surface-variant hover:text-primary transition-colors uppercase tracking-widest">
                Cancel Request
            </button>
<div class="mt-12 pt-8 border-t border-outline-variant/30 w-full">
<p class="font-label text-[10px] text-on-surface-variant uppercase tracking-widest flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[14px]" data-icon="verified_user" data-weight="fill" style="font-variation-settings: 'FILL' 1;">verified_user</span>
                    Only authorized personnel can access this section.
                </p>
</div>
</div>
</div>
<div class="fixed top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary to-transparent opacity-50"></div>
</body></html>
