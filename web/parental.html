<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TYPE-TRIS | Parental Controls</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <script defer src="assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#0b0e14",
            "surface-container": "#161a21",
            "on-surface": "#ecedf6",
            "on-surface-variant": "#a9abb3",
            primary: "#c1fffe",
            secondary: "#ff51fa",
            "outline-variant": "#45484f"
          },
          fontFamily: { headline: ["Space Grotesk"], body: ["Manrope"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen p-6">
  <main class="max-w-xl mx-auto mt-10 border border-outline-variant/30 bg-surface-container/70 p-8">
    <h1 class="font-headline text-3xl text-primary font-bold mb-4 uppercase">Parental/Teacher Controls</h1>
    <p class="text-on-surface-variant mb-6">Administrative tools placeholder. Add PIN entry and account management here.</p>
    <form class="space-y-4 mb-6">
      <label class="block text-xs uppercase tracking-widest text-on-surface-variant">Admin PIN</label>
      <input type="password" class="w-full px-3 py-2 bg-black/30 border border-outline-variant text-on-surface" placeholder="Enter PIN" />
      <button type="button" class="px-4 py-2 bg-secondary text-black font-headline font-bold uppercase tracking-widest">Unlock</button>
    </form>
    <a href="index.html" class="text-primary font-headline font-bold uppercase tracking-widest">← Main menu</a>
  </main>
</body>
</html>
