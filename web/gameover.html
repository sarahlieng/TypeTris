<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>TYPE-TRIS | Game Over</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Manrope:wght@200..800&family=Plus_Jakarta_Sans:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .glow-error {
        text-shadow: 0 0 20px rgba(255, 110, 132, 0.6);
      }
      .glow-primary {
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
      }
      .glass-overlay {
        backdrop-filter: blur(20px);
        background-color: rgba(0, 0, 0, 0.75);
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-bright": "#282c36",
              "inverse-on-surface": "#52555c",
              "error-container": "#a70138",
              "on-secondary": "#400040",
              "surface-container-highest": "#22262f",
              "surface-container-low": "#10131a",
              "outline-variant": "#45484f",
              "on-surface": "#ecedf6",
              "background": "#0b0e14",
              "surface-container-lowest": "#000000",
              "on-surface-variant": "#a9abb3",
              "tertiary-fixed-dim": "#2be800",
              "surface-container-high": "#1c2028",
              "primary-fixed-dim": "#00e6e6",
              "on-tertiary": "#0d6100",
              "primary-container": "#00ffff",
              "on-error": "#490013",
              "tertiary-container": "#2ff801",
              "secondary-container": "#a900a9",
              "tertiary-dim": "#2be800",
              "error": "#ff6e84",
              "primary-fixed": "#00f5f5",
              "inverse-primary": "#006a6a",
              "on-primary-fixed": "#004343",
              "secondary-dim": "#ff51fa",
              "surface-tint": "#c1fffe",
              "surface": "#161a21",
              "error-dim": "#d73357",
              "on-secondary-fixed-variant": "#920091",
              "on-error-container": "#ffb2b9",
              "inverse-surface": "#f9f9ff",
              "tertiary": "#8eff71",
              "surface-variant": "#22262f",
              "on-tertiary-fixed": "#064200",
              "outline": "#73757d",
              "on-primary-fixed-variant": "#006262",
              "secondary": "#ff51fa",
              "on-tertiary-fixed-variant": "#0d6200",
              "secondary-fixed-dim": "#ffa6f3",
              "on-secondary-container": "#fff5f9",
              "primary-dim": "#00e6e6",
              "on-tertiary-container": "#0b5800",
              "on-background": "#ecedf6",
            },
            fontFamily: {
              headline: ["Space Grotesk"],
              body: ["Manrope"],
              label: ["Plus Jakarta Sans"],
            },
            borderRadius: { DEFAULT: "0px", lg: "0px", xl: "0px", full: "9999px" },
          },
        },
      };
    </script>
  </head>
  <body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center overflow-hidden relative">
    <!-- Gameplay Background Mockup (Blurred and Dimmed) -->
    <div class="absolute inset-0 z-0 grid grid-cols-12 gap-1 p-8 opacity-20 scale-110 blur-sm pointer-events-none">
      <!-- Mocking Tetris Blocks -->
      <div class="col-start-4 col-span-1 h-12 bg-primary"></div>
      <div class="col-start-4 col-span-1 h-12 bg-primary"></div>
      <div class="col-start-5 col-span-1 h-12 bg-secondary"></div>
      <div class="col-start-6 col-span-2 h-12 bg-tertiary"></div>
      <div class="col-start-2 col-span-3 h-12 bg-error-container"></div>
      <div class="col-start-8 col-span-2 h-12 bg-primary-container"></div>
      <div class="col-start-5 col-span-1 h-12 bg-secondary-dim"></div>
      <div class="col-start-10 col-span-1 h-12 bg-tertiary-dim"></div>
      <div class="col-start-3 col-span-1 h-12 bg-primary"></div>
      <div class="col-start-4 col-span-2 h-12 bg-secondary"></div>
    </div>

    <!-- Modal Backdrop -->
    <div class="fixed inset-0 glass-overlay z-40"></div>

    <!-- Game Over Modal Container -->
    <div class="relative z-50 w-full max-w-md mx-4">
      <!-- Floating Card -->
      <div class="bg-surface-container border border-outline-variant/30 glow-primary p-10 flex flex-col items-center text-center">
        <!-- Glowing Skull Icon -->
        <div class="mb-6">
          <span class="material-symbols-outlined text-6xl text-error glow-error" style="font-variation-settings: 'FILL' 1;">skull</span>
        </div>

        <!-- Heading -->
        <h1 class="font-headline text-5xl font-black tracking-tighter mb-8 text-on-surface uppercase">GAME OVER!</h1>

        <!-- Body / Score Display -->
        <div class="mb-12 space-y-2">
          <p
            class="font-label text-xs tracking-[0.2em] text-secondary-dim uppercase mb-2"
            style='font-family: "Plus Jakarta Sans", sans-serif;'
          >
            YOUR FINAL SCORE
          </p>
          <p id="final-score" class="font-headline text-7xl font-bold text-primary-container tracking-tighter">0</p>
        </div>

        <!-- Action Buttons -->
        <div class="w-full space-y-4">
          <!-- RESTART LEVEL -->
          <button
            id="restart-level"
            type="button"
            class="w-full py-4 bg-primary-container text-background font-headline font-bold text-lg hover:brightness-110 transition-all duration-200 active:scale-95 flex items-center justify-center gap-2 group"
          >
            <span class="material-symbols-outlined text-xl">replay</span>
            RESTART LEVEL
          </button>

          <!-- EXIT TO PLAYER DASHBOARD -->
          <button
            id="exit-dashboard"
            type="button"
            class="w-full py-4 bg-transparent border-2 border-outline-variant text-on-surface font-headline font-bold text-lg hover:border-primary-container hover:text-primary-container transition-all duration-200 active:scale-95 flex items-center justify-center gap-2"
          >
            <span class="material-symbols-outlined text-xl">logout</span>
            EXIT TO PLAYER DASHBOARD
          </button>
        </div>
      </div>
      <!-- Decorative Corners (Tetris Fragments) -->
    </div>

    <script>
      (function () {
        var scoreEl = document.getElementById("final-score");
        var score = sessionStorage.getItem("typetrisLastScore");
        if (scoreEl) scoreEl.textContent = score != null ? String(score) : "0";

        var restartBtn = document.getElementById("restart-level");
        if (restartBtn) {
          restartBtn.addEventListener("click", function () {
            window.location.href = "gameplay.html";
          });
        }

        var exitBtn = document.getElementById("exit-dashboard");
        if (exitBtn) {
          exitBtn.addEventListener("click", function () {
            window.location.href = "player-menu.html";
          });
        }
      })();
    </script>
  </body>
</html>
