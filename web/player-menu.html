<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TYPE-TRIS | Player Menu</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <script defer src="assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }
    .neon-glow-primary {
      text-shadow: 0 0 10px rgba(193, 255, 254, 0.8), 0 0 20px rgba(0, 255, 255, 0.4), 0 0 40px rgba(0, 255, 255, 0.2);
    }
    .block-grid {
      background-image: linear-gradient(#161a21 1px, transparent 1px), linear-gradient(90deg, #161a21 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .scanline-effect {
      position: relative;
      overflow: hidden;
    }
    .scanline-effect::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 2;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }
    .glitch-effect {
      position: relative;
    }
    .glitch-effect::before,
    .glitch-effect::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.8;
    }
    .glitch-effect::before {
      left: 2px;
      text-shadow: -2px 0 #ff51fa;
      clip: rect(44px, 450px, 56px, 0);
    }
    .glitch-effect::after {
      left: -2px;
      text-shadow: -2px 0 #8eff71;
      clip: rect(12px, 450px, 34px, 0);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container flex items-center justify-center p-4 md:p-8 overflow-x-hidden">
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
    <div class="absolute top-1/4 left-1/4 w-[600px] h-[600px] bg-secondary/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[700px] h-[700px] bg-primary-container/10 rounded-full blur-[150px]"></div>
    <div class="absolute top-20 left-10 w-12 h-12 border-2 border-primary/20 rotate-12"></div>
    <div class="absolute bottom-40 right-20 w-16 h-8 border-2 border-secondary/20 -rotate-45"></div>
    <div class="absolute top-1/2 left-1/2 w-10 h-10 border-2 border-tertiary/20 rotate-[30deg]"></div>
  </div>

  <div class="w-full max-w-7xl bg-surface-container-low border border-outline-variant/30 shadow-2xl overflow-hidden flex flex-col items-center min-h-[85vh] justify-center py-12">
    <header class="w-full mb-12 md:mb-16 flex flex-col justify-center items-center">
      <h1 class="font-headline text-6xl md:text-8xl font-black italic tracking-tighter text-primary neon-glow-primary glitch-effect leading-none uppercase text-center" data-text="TYPE-TRIS">TYPE-TRIS</h1>
      <div class="flex items-center gap-4 mt-4 opacity-60">
        <div class="h-[1px] w-12 bg-outline-variant"></div>
        <span class="font-label text-xs md:text-sm text-secondary tracking-[0.3em] uppercase font-bold">The Ultimate Typing Challenge</span>
        <div class="h-[1px] w-12 bg-outline-variant"></div>
      </div>
    </header>

    <main class="w-full px-8 md:px-16 lg:px-24">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-24 items-center max-w-6xl mx-auto">
        <div class="relative aspect-square w-full max-w-[480px] mx-auto flex items-center justify-center bg-surface-container-lowest border border-outline-variant/20 overflow-hidden group scanline-effect">
          <div class="absolute inset-0 block-grid opacity-30"></div>
          <div class="relative w-80 h-[85%] border-x-2 border-primary/30 flex flex-col justify-end p-6">
            <div class="absolute top-16 left-16 w-12 h-12 bg-primary/20 border-2 border-primary flex items-center justify-center text-primary font-headline font-bold text-xl shadow-[0_0_20px_rgba(0,255,255,0.6)] animate-bounce">A</div>
            <div class="absolute top-40 right-20 w-12 h-12 bg-secondary/20 border-2 border-secondary flex items-center justify-center text-secondary font-headline font-bold text-xl shadow-[0_0_20px_rgba(255,81,250,0.6)]">K</div>
            <div class="flex flex-col gap-1.5">
              <div class="flex gap-1.5 justify-center">
                <div class="w-12 h-12 bg-primary/10 border-2 border-primary/60 flex items-center justify-center text-primary font-headline font-bold text-xl shadow-[0_0_10px_rgba(0,255,255,0.3)]">T</div>
                <div class="w-12 h-12 bg-primary/10 border-2 border-primary/60 flex items-center justify-center text-primary font-headline font-bold text-xl shadow-[0_0_10px_rgba(0,255,255,0.3)]">Y</div>
                <div class="w-12 h-12 bg-primary/10 border-2 border-primary/60 flex items-center justify-center text-primary font-headline font-bold text-xl shadow-[0_0_10px_rgba(0,255,255,0.3)]">P</div>
              </div>
              <div class="flex gap-1.5 justify-center translate-x-6">
                <div class="w-12 h-12 bg-secondary/10 border-2 border-secondary/60 flex items-center justify-center text-secondary font-headline font-bold text-xl shadow-[0_0_10px_rgba(255,81,250,0.3)]">E</div>
                <div class="w-12 h-12 bg-secondary/10 border-2 border-secondary/60 flex items-center justify-center text-secondary font-headline font-bold text-xl shadow-[0_0_10px_rgba(255,81,250,0.3)]">S</div>
              </div>
            </div>
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-transparent to-transparent pointer-events-none"></div>
        </div>

        <div class="flex flex-col gap-8 md:gap-10 w-full max-w-[480px] mx-auto text-center lg:text-left">
          <div class="space-y-4">
            <p class="font-label text-sm md:text-base tracking-[0.3em] text-secondary font-bold uppercase">PLAYER MENU</p>
            <h2 class="font-headline text-5xl md:text-6xl font-bold text-on-surface tracking-tight leading-tight">
              WELCOME, <br />
              <span id="player-menu-username" class="text-primary break-all">PLAYER</span>
            </h2>
          </div>

          <div class="flex flex-col gap-6 w-full">
            <a id="player-menu-start" href="difficulty.html" class="w-full h-20 bg-primary-container text-on-primary-container font-headline font-extrabold text-2xl uppercase tracking-[0.2em] hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-4 shadow-[0_15px_40px_-10px_rgba(0,255,255,0.5)]">
              <span class="material-symbols-outlined text-3xl">play_arrow</span>
              START GAME
            </a>
            <div class="grid grid-cols-2 gap-6">
              <a href="highscores.html" class="h-16 border-2 border-outline-variant bg-surface-container/50 text-on-surface font-label font-semibold text-xs md:text-sm uppercase tracking-wider hover:bg-surface-container hover:border-secondary-dim transition-all active:scale-[0.98] flex items-center justify-center gap-3">
                <span class="material-symbols-outlined text-xl">analytics</span>
                STATISTICS
              </a>
              <button type="button" id="player-menu-save" class="h-16 border-2 border-outline-variant bg-surface-container/50 text-on-surface font-label font-semibold text-xs md:text-sm uppercase tracking-wider hover:bg-surface-container hover:border-secondary-dim transition-all active:scale-[0.98] flex items-center justify-center gap-3">
                <span class="material-symbols-outlined text-xl">save</span>
                SAVE GAME
              </button>
            </div>
            <button type="button" id="player-menu-logout" class="w-full h-16 border-2 border-outline-variant bg-surface-container/50 text-on-surface-variant font-label font-semibold text-sm uppercase tracking-wider hover:bg-surface-container hover:border-error transition-all active:scale-[0.98] flex items-center justify-center gap-3">
              <span class="material-symbols-outlined text-xl">logout</span>
              LOGOUT
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
