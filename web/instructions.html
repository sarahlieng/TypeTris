<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TYPE-TRIS | Instructions</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#0b0e14",
            "surface-container": "#161a21",
            "on-surface": "#ecedf6",
            "on-surface-variant": "#a9abb3",
            primary: "#c1fffe",
            "outline-variant": "#45484f"
          },
          fontFamily: { headline: ["Space Grotesk"], body: ["Manrope"] }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen p-6">
  <main class="max-w-3xl mx-auto mt-10 border border-outline-variant/30 bg-surface-container/70 p-8">
    <h1 class="font-headline text-3xl text-primary font-bold mb-4 uppercase">Instructions</h1>
    <p class="text-on-surface leading-relaxed mb-3">Type the words on falling blocks to place and control pieces.</p>
    <p class="text-on-surface leading-relaxed mb-3">Clear rows for points. Maintain streaks for bonus scoring.</p>
    <p class="text-on-surface leading-relaxed mb-6">Use power-ups like speed freeze and bomb blast when available.</p>
    <a href="index.html" class="text-primary font-headline font-bold uppercase tracking-widest">← Main menu</a>
  </main>
</body>
</html>
