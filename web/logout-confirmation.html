<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Logout Confirmation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Manrope:wght@200;300;400;500;600;700;800&family=Plus+Jakarta_Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "error-dim": "#d73357",
              "surface-container-high": "#1c2028",
              "primary-container": "#00ffff",
              "secondary-fixed-dim": "#ffa6f3",
              "inverse-primary": "#006a6a",
              "primary": "#c1fffe",
              "on-surface-variant": "#a9abb3",
              "on-secondary-container": "#fff5f9",
              "on-primary": "#006767",
              background: "#0b0e14",
              "inverse-on-surface": "#52555c",
              "secondary-dim": "#ff51fa",
              "surface-container": "#161a21",
              "on-error-container": "#ffb2b9",
              "tertiary-dim": "#2be800",
              "primary-fixed": "#00f5f5",
              "surface-container-low": "#10131a",
              "primary-fixed-dim": "#00e6e6",
              "surface-container-lowest": "#000000",
              "outline-variant": "#45484f",
              "on-tertiary-container": "#0b5800",
              "surface-variant": "#22262f",
              "secondary-fixed": "#ffbdf3",
              "on-surface": "#ecedf6",
              "surface-container-highest": "#22262f",
              secondary: "#ff51fa",
              tertiary: "#8eff71",
              "on-error": "#490013",
              "tertiary-fixed-dim": "#2be800",
              "error-container": "#a70138",
              "on-primary-fixed": "#004343",
              "secondary-container": "#a900a9",
              "surface-dim": "#0b0e14",
              "surface-tint": "#c1fffe",
              "tertiary-fixed": "#2ff801",
              surface: "#0b0e14",
              "inverse-surface": "#f9f9ff",
              outline: "#73757d",
              "surface-bright": "#282c36",
              "on-tertiary": "#0d6100",
              "on-tertiary-fixed-variant": "#0d6200",
              "on-secondary": "#400040",
              "tertiary-container": "#2ff801",
              "primary-dim": "#00e6e6",
              "on-background": "#ecedf6",
              "on-secondary-fixed": "#620061",
              "on-tertiary-fixed": "#064200",
            },
            fontFamily: {
              headline: ["Space Grotesk"],
              body: ["Manrope"],
              label: ["Plus Jakarta Sans"],
            },
            borderRadius: { DEFAULT: "8px", lg: "12px", xl: "16px", full: "9999px" },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .glow-cyan {
        filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.6));
      }
    </style>
  </head>
  <body class="bg-black text-on-surface font-body min-h-screen flex items-center justify-center">
    <!-- Modal Overlay -->
    <div class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/60 backdrop-blur-[2px]">
      <!-- Logout Card Modal -->
      <div class="bg-[#10131a] w-full max-w-[400px] border border-white/10 rounded-2xl flex flex-col items-center p-10 relative shadow-2xl">
        <!-- Warning Icon -->
        <div class="mb-8 flex items-center justify-center w-14 h-14 bg-[#1c2028] border border-white/5 rounded-xl shadow-inner">
          <span class="material-symbols-outlined text-3xl text-primary-container glow-cyan" style="font-variation-settings: 'FILL' 1;"
            >warning</span
          >
        </div>

        <!-- Content -->
        <div class="text-center w-full mb-8">
          <h1 class="font-headline text-xl md:text-2xl font-bold text-white leading-tight uppercase tracking-tight mb-3">
            ARE YOU SURE YOU WANT TO LOG OUT?
          </h1>
          <p class="text-on-surface-variant font-body text-sm font-medium opacity-70">
            Any unsaved progress will be lost.
          </p>
        </div>

        <!-- Actions -->
        <div class="w-full space-y-3">
          <!-- YES BUTTON -->
          <button
            id="logout-yes"
            type="button"
            class="w-full bg-primary-container text-black font-headline font-bold py-4 text-lg hover:brightness-110 active:scale-[0.98] transition-all duration-150 rounded-none uppercase tracking-widest shadow-[inset_0_2px_4px_rgba(255,255,255,0.3)]"
          >
            YES, LOGOUT
          </button>

          <!-- GO BACK BUTTON -->
          <button
            id="logout-go-back"
            type="button"
            class="w-full py-4 border border-white/10 bg-transparent text-primary-container font-headline font-bold text-lg tracking-widest uppercase transition-all duration-200 hover:bg-white/5 active:scale-[0.98] rounded-none"
          >
            GO BACK
          </button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var yesBtn = document.getElementById("logout-yes");
        var backBtn = document.getElementById("logout-go-back");
        var returnUrl =
          sessionStorage.getItem("typetrisLogoutReturnUrl") || "player-menu.html";

        if (backBtn) {
          backBtn.addEventListener("click", function () {
            window.location.href = returnUrl;
          });
        }

        if (yesBtn) {
          yesBtn.addEventListener("click", function () {
            try {
              sessionStorage.removeItem("typetrisPlayerUsername");
              sessionStorage.removeItem("typetrisDifficulty");
            } catch (e) {
              // ignore
            }
            try {
              sessionStorage.removeItem("typetrisLogoutReturnUrl");
            } catch (e2) {
              // ignore
            }
            window.location.href = "logout-success.html";
          });
        }
      })();
    </script>
  </body>
</html>
