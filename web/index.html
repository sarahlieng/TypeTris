<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>TYPE-TRIS | Main Menu</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <script defer src="assets/js/app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@200;300;400;500;600;700;800&amp;family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <style>
    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      display: inline-block;
      line-height: 1;
      white-space: nowrap;
    }
    .neon-glow-primary {
      text-shadow: 0 0 10px rgba(193, 255, 254, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
    }
    .neon-glow-secondary {
      text-shadow: 0 0 10px rgba(255, 81, 250, 0.8), 0 0 20px rgba(169, 0, 169, 0.4);
    }
    .glitch-effect { position: relative; }
    .glitch-effect::before,
    .glitch-effect::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }
    .glitch-effect::before {
      left: 2px;
      text-shadow: -2px 0 #ff51fa;
      clip: rect(44px, 450px, 56px, 0);
      animation: title-glitch-a 5s infinite steps(1, end);
    }
    .glitch-effect::after {
      left: -2px;
      text-shadow: -2px 0 #8eff71;
      clip: rect(12px, 450px, 34px, 0);
      animation: title-glitch-b 5s infinite steps(1, end);
    }
    @keyframes title-glitch-a {
      0%, 84%, 100% { opacity: 0; transform: translate(0, 0); clip: rect(44px, 999px, 56px, 0); }
      85% { opacity: 0.9; transform: translate(2px, 0); clip: rect(10px, 999px, 34px, 0); }
      86% { opacity: 0.6; transform: translate(-1px, -1px); clip: rect(38px, 999px, 66px, 0); }
      87% { opacity: 0.8; transform: translate(1px, 1px); clip: rect(22px, 999px, 46px, 0); }
    }
    @keyframes title-glitch-b {
      0%, 84%, 100% { opacity: 0; transform: translate(0, 0); clip: rect(12px, 999px, 34px, 0); }
      85% { opacity: 0.9; transform: translate(-2px, 0); clip: rect(42px, 999px, 72px, 0); }
      86% { opacity: 0.7; transform: translate(1px, 1px); clip: rect(16px, 999px, 38px, 0); }
      87% { opacity: 0.8; transform: translate(-1px, -1px); clip: rect(50px, 999px, 78px, 0); }
    }
    .tetris-3d-piece {
      display: grid;
      grid-template-columns: repeat(3, 40px);
      grid-template-rows: repeat(2, 40px);
      gap: 2px;
      filter: drop-shadow(0 0 20px rgba(255, 81, 250, 0.6));
    }
    .tetris-block {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff51fa 0%, #a900a9 100%);
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset -4px -4px 0 rgba(0,0,0,0.2), inset 4px 4px 0 rgba(255,255,255,0.2);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen overflow-hidden">
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,#161a21_0%,#0b0e14_100%)]"></div>
    <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-primary/5 rounded-full blur-[150px]"></div>
  </div>

  <main class="relative z-10 flex flex-col items-center justify-between min-h-screen px-6 py-8 md:py-12">
    <header class="flex flex-col items-center gap-2">
      <h1 class="font-headline text-6xl md:text-8xl font-black italic tracking-tighter text-primary neon-glow-primary glitch-effect leading-none" data-text="TYPE-TRIS">TYPE-TRIS</h1>
      <div class="flex items-center gap-4 mt-2">
        <div class="h-[1px] w-12 bg-outline-variant"></div>
        <span class="font-label text-sm text-secondary tracking-widest uppercase neon-glow-secondary font-bold">The Ultimate Typing Challenge</span>
        <div class="h-[1px] w-12 bg-outline-variant"></div>
      </div>
    </header>

    <div class="my-12">
      <div class="relative w-80 h-48 flex items-center justify-center border border-secondary/20 rounded-2xl bg-surface-container/20 backdrop-blur-md shadow-[0_0_50px_rgba(0,0,0,0.5)]">
        <div class="tetris-3d-piece">
          <div class="tetris-block" style="grid-column:2;grid-row:1;"></div>
          <div class="tetris-block" style="grid-column:1;grid-row:2;"></div>
          <div class="tetris-block" style="grid-column:2;grid-row:2;"></div>
          <div class="tetris-block" style="grid-column:3;grid-row:2;"></div>
        </div>
        <div class="absolute inset-0 opacity-20 pointer-events-none blur-xl bg-secondary rounded-full"></div>
      </div>
    </div>

    <nav class="flex flex-col gap-4 w-full max-w-lg">
      <a href="login.html" class="group relative flex items-center justify-center bg-primary-container text-on-primary px-8 py-6 transition-all duration-200 active:scale-95 border-0 rounded-none overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500"></div>
        <div class="flex items-center gap-4">
          <span class="font-headline font-extrabold text-2xl tracking-widest uppercase">LOGIN</span>
          <span class="material-symbols-outlined text-2xl">login</span>
        </div>
      </a>
      <div class="grid grid-cols-2 gap-4">
        <a href="highscores.html" class="group flex items-center justify-between bg-surface-container hover:bg-surface-bright text-on-surface px-6 py-5 transition-all duration-150 active:scale-95 border-r-4 border-secondary/0 hover:border-secondary rounded-none">
          <span class="font-headline font-bold text-base tracking-widest uppercase">HIGH SCORES</span>
          <span class="material-symbols-outlined text-secondary">leaderboard</span>
        </a>
        <a href="instructions.html" class="group flex items-center justify-between bg-surface-container hover:bg-surface-bright text-on-surface px-6 py-5 transition-all duration-150 active:scale-95 border-r-4 border-primary/0 hover:border-primary rounded-none">
          <span class="font-headline font-bold text-base tracking-widest uppercase">INSTRUCTIONS</span>
          <span class="material-symbols-outlined text-primary">menu_book</span>
        </a>
      </div>
      <a href="parental.html" class="group flex items-center justify-center gap-4 bg-surface-container hover:bg-surface-bright text-on-surface px-8 py-5 transition-all duration-150 active:scale-95 border-b-4 border-tertiary/0 hover:border-tertiary rounded-none">
        <span class="font-headline font-bold text-lg tracking-widest uppercase">PARENTAL/TEACHER CONTROLS</span>
        <span class="material-symbols-outlined text-tertiary">lock_person</span>
      </a>
      <button type="button" data-exit="app" class="group flex items-center justify-center gap-2 text-on-surface-variant hover:text-error transition-all duration-150 py-2 mt-2">
        <span class="font-headline font-bold text-sm tracking-widest uppercase">EXIT GAME</span>
        <span class="material-symbols-outlined text-sm">logout</span>
      </button>
    </nav>

    <footer class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-8 pt-8 border-t border-outline-variant/20">
      <div class="flex flex-col items-center md:items-start">
        <span class="font-label text-[10px] text-outline tracking-widest uppercase mb-1">DEVELOPMENT TEAM</span>
        <span class="font-headline font-bold text-on-surface tracking-wider uppercase">Team 26</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="font-label text-[10px] text-outline tracking-widest uppercase mb-1">DEPLOYMENT CYCLE</span>
        <span class="font-headline font-bold text-on-surface tracking-wider uppercase">Winter 2026</span>
      </div>
      <div class="flex flex-col items-center md:items-end">
        <span class="font-label text-[10px] text-outline tracking-widest uppercase mb-1">CLASS</span>
        <span class="font-headline font-bold text-on-surface tracking-wider uppercase text-center md:text-right">CS2212 at Western University</span>
      </div>
    </footer>
  </main>
</body>
</html>
