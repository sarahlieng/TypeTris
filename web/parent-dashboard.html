<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Type-tris | Parent/Teacher Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script defer src="assets/js/app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800;900&amp;family=Manrope:wght@300;400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface": "#0b0e14",
              "tertiary-container": "#2ff801",
              "surface-container-lowest": "#000000",
              "outline": "#73757d",
              "on-surface": "#ecedf6",
              "inverse-surface": "#f9f9ff",
              "surface-container-high": "#1c2028",
              "on-background": "#ecedf6",
              "on-tertiary": "#0d6100",
              "on-secondary": "#400040",
              "on-secondary-fixed": "#620061",
              "inverse-on-surface": "#52555c",
              "surface-container": "#161a21",
              "secondary-fixed-dim": "#ffa6f3",
              "error-container": "#a70138",
              "on-primary-container": "#005d5d",
              "tertiary-dim": "#2be800",
              "surface-tint": "#c1fffe",
              "surface-container-highest": "#22262f",
              "on-primary-fixed-variant": "#006262",
              "on-tertiary-container": "#0b5800",
              "on-primary": "#006767",
              "primary": "#c1fffe",
              "on-primary-fixed": "#004343",
              "error": "#ff6e84",
              "on-tertiary-fixed-variant": "#0d6200",
              "primary-container": "#00ffff",
              "on-tertiary-fixed": "#064200",
              "secondary": "#ff51fa",
              "on-surface-variant": "#a9abb3",
              "secondary-fixed": "#ffbdf3",
              "error-dim": "#d73357",
              "tertiary-fixed-dim": "#2be800",
              "background": "#0b0e14",
              "primary-fixed": "#00f5f5",
              "secondary-dim": "#ff51fa",
              "on-error-container": "#ffb2b9",
              "on-secondary-container": "#fff5f9",
              "primary-fixed-dim": "#00e6e6",
              "on-secondary-fixed-variant": "#920091",
              "secondary-container": "#a900a9",
              "on-error": "#490013",
              "outline-variant": "#45484f",
              "surface-dim": "#0b0e14",
              "tertiary": "#8eff71",
              "inverse-primary": "#006a6a",
              "surface-container-low": "#10131a",
              "surface-variant": "#22262f",
              "tertiary-fixed": "#2ff801",
              "surface-bright": "#282c36",
              "primary-dim": "#00e6e6"
            },
            fontFamily: {
              "headline": ["Space Grotesk"],
              "body": ["Manrope"],
              "label": ["Plus Jakarta Sans"]
            },
            borderRadius: {"DEFAULT": "0rem", "lg": "0rem", "xl": "0rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0b0e14;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(169, 0, 169, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 230, 230, 0.15) 0%, transparent 40%);
        }
        .tetris-bg-block {
            position: fixed;
            z-index: -1;
            opacity: 0.1;
            filter: blur(1px);
        }
        .neon-glow-primary {
            text-shadow: 0 0 10px rgba(193, 255, 254, 0.8), 0 0 20px rgba(0, 255, 255, 0.4);
        }
        .neon-glow-secondary {
            text-shadow: 0 0 10px rgba(255, 81, 250, 0.8), 0 0 20px rgba(169, 0, 169, 0.4);
        }
    </style>
</head>
<body class="font-body text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
<div class="tetris-bg-block top-20 left-[10%] w-12 h-12 border-2 border-primary"></div>
<div class="tetris-bg-block bottom-40 right-[15%] w-24 h-8 border-2 border-secondary"></div>
<div class="tetris-bg-block top-[60%] left-[5%] w-16 h-16 border-2 border-tertiary"></div>
<div class="tetris-bg-block top-10 right-[5%] w-8 h-24 border-2 border-primary-dim"></div>
<header class="fixed top-0 w-full z-50 flex flex-col items-center justify-center h-48 px-6 bg-slate-950/40 backdrop-blur-md">
<div class="absolute left-8 top-12 flex items-center gap-4">
<button onclick="window.location.href='parental.html'" class="text-primary hover:text-primary-fixed transition-colors active:scale-95">
<span class="material-symbols-outlined text-4xl">arrow_back</span>
</button>
<button id="parent-logout" class="px-3 py-2 text-[10px] font-label font-bold tracking-widest uppercase border border-outline hover:border-primary hover:text-primary transition-all">
            LOCK
          </button>
</div>
<div class="flex flex-col items-center">
<h1 class="font-headline text-6xl md:text-7xl font-black italic tracking-tighter text-primary neon-glow-primary leading-none uppercase">
            TYPE-TRIS
        </h1>
<div class="flex items-center gap-4 mt-3">
<div class="h-[1px] w-8 bg-outline-variant/50"></div>
<p class="text-xs font-label font-extrabold tracking-[0.3em] text-secondary neon-glow-secondary uppercase">
            PARENT/TEACHER MANAGEMENT
        </p>
<div class="h-[1px] w-8 bg-outline-variant/50"></div>
</div>
</div>
</header>
<main id="parent-dashboard" class="pt-60 pb-20 px-4 flex justify-center items-start min-h-screen">
<div class="w-full max-w-4xl bg-surface-container/60 backdrop-blur-xl border border-outline-variant/20 p-8 shadow-2xl">
<p id="parent-dashboard-message" class="hidden text-xs font-label uppercase tracking-widest mb-6"></p>
<section class="mb-12">
<header class="flex items-center gap-4 mb-8">
<h2 class="text-xs font-label font-bold tracking-widest text-primary uppercase">
                        ACCOUNT MANAGEMENT
                    </h2>
<div class="h-[1px] flex-grow bg-gradient-to-r from-primary/30 to-transparent"></div>
</header>
<div id="parent-dashboard-sessions-list" class="space-y-0 border border-outline-variant/10"></div>
<button id="parent-create-account" type="button" class="w-full mt-6 bg-primary text-on-primary font-label font-extrabold tracking-[0.2em] py-5 uppercase hover:bg-primary-container transition-colors shadow-[0_0_15px_rgba(0,255,255,0.2)] active:scale-[0.99] transform">
                    CREATE NEW ACCOUNT
                </button>
</section>
<section>
<header class="flex items-center gap-4 mb-8">
<h2 class="text-xs font-label font-bold tracking-widest text-primary uppercase">
                        GLOBAL SETTINGS
                    </h2>
<div class="h-[1px] flex-grow bg-gradient-to-r from-primary/30 to-transparent"></div>
</header>
<div class="bg-surface-container-lowest/40 p-1 border border-outline-variant/5">
<button type="button" class="w-full border-2 border-secondary/50 text-secondary font-label font-bold tracking-[0.15em] py-4 uppercase hover:bg-secondary/10 transition-all active:scale-[0.99] transform">
                        RESET GLOBAL HIGH SCORES
                    </button>
</div>
<p class="mt-4 text-[10px] font-label text-on-surface-variant uppercase tracking-widest text-center opacity-60">
                    Warning: This action is permanent and affects all student accounts.
                </p>
</section>
</div>
</main>
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-1/4 right-0 w-96 h-96 bg-secondary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 left-0 w-96 h-96 bg-primary/5 rounded-full blur-[120px]"></div>
</div>
</body></html>
